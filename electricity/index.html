<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f9fc">
    <meta
      name="description"
      content="Мобильный учёт показаний и расходов электроэнергии по тарифам Т1 и Т2."
    >
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='18'%20fill='%232f67e8'/%3E%3Cpath%20d='M36%207%2017%2036h13l-2%2021%2019-31H34z'%20fill='white'/%3E%3C/svg%3E"
    >
    <title>Учёт электроэнергии</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">К содержанию</a>
    <div class="app-shell">
      <header class="app-header">
        <span class="brand-mark" aria-hidden="true">⚡</span>
        <div>
          <p class="eyebrow">Домашний учёт</p>
          <h1>Учёт электроэнергии</h1>
        </div>
      </header>
      <div
        id="notifications"
        class="notifications"
        aria-live="polite"
        aria-atomic="true"
      ></div>
      <main id="main-content" tabindex="-1">
        <div id="app">
          <div class="loading-state" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <span>Загрузка…</span>
            <span class="skeleton" aria-hidden="true"></span>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
