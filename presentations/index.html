<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Презентации · bencode</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1210;
        --ink: #f4f1e8;
        --muted: #8f988a;
        --accent: #7cff6b;
        --card: #162019;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        width: min(40rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2.5rem 0 3rem;
      }
      .eyebrow {
        margin: 0 0 0.6rem;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 6vw, 2.4rem);
        line-height: 1.1;
      }
      .lead {
        margin: 0 0 1.75rem;
        color: var(--muted);
        line-height: 1.45;
      }
      a.deck {
        display: block;
        margin: 0 0 0.85rem;
        padding: 1.15rem 1.2rem;
        background: var(--card);
        border: 1px solid rgba(244, 241, 232, 0.1);
        border-radius: 1rem;
        color: inherit;
        text-decoration: none;
      }
      a.deck:hover,
      a.deck:focus-visible {
        border-color: var(--accent);
      }
      a.deck strong {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 1.15rem;
      }
      a.deck span {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .home {
        display: inline-block;
        margin-top: 1.25rem;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Bento · GitHub Pages</p>
      <h1>Презентации</h1>
      <p class="lead">Открой колоду в браузере телефона. Поверни экран горизонтально и нажми Slideshow.</p>
      <a class="deck" href="Q3_2025.bento.html">
        <strong>Q3 2025 · Итоги квартала</strong>
        <span>Рост 18%, микс платформ, план/факт и запрос на Q4.</span>
      </a>
      <a class="deck" href="Bento_brief.bento.html">
        <strong>Как заказать колоду</strong>
        <span>Короткий бриф: что написать агенту, чтобы получить слайды.</span>
      </a>
      <a class="home" href="../">← На схему CPO</a>
    </main>
  </body>
</html>
